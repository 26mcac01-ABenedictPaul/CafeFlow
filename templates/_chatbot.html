{# CafeFlow assistant: floating chat bubble for logged-in students #}
<style>
#cbFab{position:fixed;right:20px;bottom:20px;z-index:80;width:62px;height:62px;border-radius:50%;border:0;cursor:pointer;font-size:1.9rem;color:#fff;background:linear-gradient(135deg,#ff6b35,#ff5fa2);box-shadow:0 10px 26px rgba(255,95,162,.45);transition:transform .2s}
#cbFab:hover{transform:scale(1.1) rotate(-6deg)}#cbFab .dot{position:absolute;top:2px;right:2px;width:14px;height:14px;border-radius:50%;background:#12a37f;border:2px solid #fff;animation:cbp 2s infinite}@keyframes cbp{50%{transform:scale(1.3)}}
#cbWin{position:fixed;right:20px;bottom:94px;z-index:80;width:min(380px,calc(100vw - 24px));height:min(560px,calc(100vh - 120px));background:#fff;border-radius:24px;box-shadow:0 24px 60px rgba(27,31,59,.35);display:none;flex-direction:column;overflow:hidden;animation:cbup .3s cubic-bezier(.2,1.3,.4,1)}
#cbWin.on{display:flex}@keyframes cbup{from{transform:translateY(30px) scale(.94);opacity:0}}
.cbh{background:linear-gradient(135deg,#ff6b35,#ff5fa2);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}.cbh b{display:block}.cbh small{opacity:.9}.cbh .av{font-size:1.8rem;background:rgba(255,255,255,.25);border-radius:50%;width:42px;height:42px;display:grid;place-items:center}
.cbh button{margin-left:auto;background:none;border:0;color:#fff;font-size:1.6rem;cursor:pointer}
#cbMsgs{flex:1;overflow-y:auto;padding:14px;background:#f7f8fc;display:flex;flex-direction:column;gap:10px}
.cbm{max-width:86%;padding:9px 13px;border-radius:18px;line-height:1.4;white-space:pre-line;animation:cbin .25s}@keyframes cbin{from{opacity:0;transform:translateY(8px)}}
.cbm.bot{background:#fff;border:1px solid var(--line);border-bottom-left-radius:5px;align-self:flex-start}.cbm.me{background:var(--ink);color:#fff;border-bottom-right-radius:5px;align-self:flex-end}
.cbi{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:6px 8px;margin-top:6px;align-self:flex-start;max-width:96%}.cbi .e{font-size:1.5rem}.cbi div{flex:1;line-height:1.2}.cbi small{color:var(--mut)}
.cbi button{border:0;border-radius:99px;background:#12a37f;color:#fff;font-weight:700;padding:5px 12px;cursor:pointer}.cbi button:disabled{background:#9aa3b8}
.cbl,.cbc{display:flex;flex-wrap:wrap;gap:6px;align-self:flex-start}.cbl a{background:var(--ink);color:#fff;border-radius:99px;padding:5px 13px;font-weight:700;font-size:.85rem;text-decoration:none}
.cbc button{border:1.5px solid #ffb89c;background:#fff4ee;border-radius:99px;padding:5px 12px;font:inherit;font-size:.85rem;font-weight:600;cursor:pointer}.cbc button:hover{background:#ffe3d6}
.cbf{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);background:#fff}.cbf input{flex:1;margin:0;border-radius:99px;padding:10px 14px}.cbf button{border:0;border-radius:50%;width:42px;height:42px;background:var(--ink);color:#fff;font-size:1.1rem;cursor:pointer}
.cbt{align-self:flex-start;color:var(--mut);font-size:.85rem}
</style>
<button id="cbFab" aria-label="Chat with CafeFlow assistant" title="Ask me anything">💬<span class="dot"></span></button>
<div id="cbWin" role="dialog" aria-label="CafeFlow assistant"><div class="cbh"><span class="av">🤖</span><div><b>CafeFlow Assistant</b><small>Menu, orders, offers, tables, parties</small></div><button id="cbX" aria-label="Close">&times;</button></div>
<div id="cbMsgs"></div><form class="cbf" id="cbF"><input id="cbIn" maxlength="200" autocomplete="off" placeholder="Ask about a dish, offer, order..."><button aria-label="Send">&#10148;</button></form></div>
<script>
(function(){const W=document.getElementById('cbWin'),M=document.getElementById('cbMsgs'),I=document.getElementById('cbIn');let started=false;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function add(cls,html){const d=document.createElement('div');d.className=cls;d.innerHTML=html;M.appendChild(d);M.scrollTop=M.scrollHeight;return d}
function render(r){if(r.text)add('cbm bot',esc(r.text));
 (r.items||[]).forEach(i=>{const d=add('cbi','<span class="e">'+i.emoji+'</span><div><b>'+esc(i.name)+'</b><br><small>Rs '+i.price+' &middot; '+esc(i.counter)+(i.veg?'':' &middot; non-veg')+'</small></div><button data-i="'+i.id+'">Add</button>');
  d.querySelector('button').onclick=async function(){this.disabled=true;const j=await (await fetch('/api/chat/add',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({iid:i.id})})).json();this.textContent=j.ok?'Added ✓':'Add';if(!j.ok)this.disabled=false;add('cbm bot',esc(j.msg));}});
 if((r.links||[]).length)add('cbl',r.links.map(l=>'<a href="'+l.url+'">'+esc(l.label)+'</a>').join(''));
 if((r.chips||[]).length){const c=add('cbc',r.chips.map(x=>'<button type="button">'+esc(x)+'</button>').join(''));c.querySelectorAll('button').forEach(b=>b.onclick=()=>{c.remove();send(b.textContent)})}}
async function send(t){t=t.trim();if(!t)return;add('cbm me',esc(t));I.value='';const w=add('cbt','typing...');
 try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t})});const j=await r.json();w.remove();render(j)}catch(e){w.remove();add('cbm bot','Sorry, I could not reach the canteen right now. Please try again.')}}
function open_(){W.classList.add('on');if(!started){started=true;send('hi')}I.focus()}
document.getElementById('cbFab').onclick=()=>W.classList.contains('on')?W.classList.remove('on'):open_();document.getElementById('cbX').onclick=()=>W.classList.remove('on');
document.getElementById('cbF').onsubmit=e=>{e.preventDefault();send(I.value)};
document.addEventListener('keydown',e=>{if(e.key==='Escape')W.classList.remove('on')});})();
</script>
